<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Cryptstorm 3D</title><link rel="stylesheet" href="./style.css"></head><body><div id="game"></div><div id="hud"></div><div id="modal" class="show"></div><script>(()=>{const nativeAdd=EventTarget.prototype.addEventListener;EventTarget.prototype.addEventListener=function(type,listener,options){if(this===document&&type==='mousemove'&&typeof listener==='function'){const wrapped=function(e){const fixed=Object.create(e);Object.defineProperties(fixed,{movementX:{value:e.movementX},movementY:{value:-e.movementY}});return listener.call(this,fixed)};return nativeAdd.call(this,type,wrapped,options)}if(this===window&&(type==='keydown'||type==='keyup')&&typeof listener==='function'){const wrapped=function(e){let code=e.code,key=e.key;if(code==='KeyA'){code='KeyD';key=e.key==='a'?'d':e.key==='A'?'D':e.key}else if(code==='KeyD'){code='KeyA';key=e.key==='d'?'a':e.key==='D'?'A':e.key}if(code!==e.code){const fixed=Object.create(e);Object.defineProperties(fixed,{code:{value:code},key:{value:key}});return listener.call(this,fixed)}return listener.call(this,e)};return nativeAdd.call(this,type,wrapped,options)}return nativeAdd.call(this,type,listener,options)}})();</script><script type="module" src="./src/main.js"></script></body></html>
